<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Moon intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #f4f2ec; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// The Moon intro. Every frame is a pure function of time t (seconds), so render-intro.mjs can step
// through it frame by frame. Light theme in moon colours: pearl background, deep navy, moon gold.
const W = 1920, H = 1080;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const C = {
  bg: "#f4f2ec", bgHi: "#fbfaf6", dot: "#e2ddd0",
  card: "#ffffff", cream: "#fcf7ea", line: "#ddd6c6",
  navy: "#16203d", navy2: "#24315a", text: "#18203a", muted: "#66708a", faint: "#a39c8c",
  gold: "#b38b3f", goldSoft: "#e9dcbc", blue: "#4a6aa5", blueSoft: "#dfe6f3",
  moonLight: "#fbf8f0", moonMid: "#e9e2d0", moonDark: "#c9bfa6",
};
const SANS = 'Inter, "Segoe UI", Arial, sans-serif';
const MONO = '"JetBrains Mono", Consolas, monospace';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeIO = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeBack = (k) => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const ap = (u, s, d = 0.5) => easeOut(clamp((u - s) / d));
const bump = (u, s, e, r = 0.35) => clamp((u - s) / r) * (1 - clamp((u - e) / r));
function mix(c1, c2, k) {
  const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const a = p(c1), b = p(c2);
  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",")})`;
}
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function withAlpha(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, { size = 24, font = SANS, weight = 500, color = C.text, align = "left", spacing = 0 } = {}) {
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.letterSpacing = spacing + "px";
  ctx.fillText(s, x, y);
  ctx.letterSpacing = "0px";
}

// Connector drawn up to fraction k; when "flow" > 0 its dashes move to show direction.
function connector(pts, { k = 1, color = C.faint, width = 2, dash = null, flow = 0, t = 0 } = {}) {
  if (k <= 0) return;
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  let left = total * k;
  ctx.save();
  const col = flow > 0 ? mix(color.startsWith("#") ? color : C.faint, C.gold, flow) : color;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = width + flow; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (flow > 0.05) { ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 40; } else if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  let end = pts[0], prev = pts[0];
  for (let i = 1; i < pts.length && left > 0; i++) {
    const f = Math.min(1, left / segs[i - 1]);
    end = [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)];
    prev = pts[i - 1]; ctx.lineTo(...end); left -= segs[i - 1];
  }
  ctx.stroke(); ctx.setLineDash([]);
  if (k > 0.97) {
    const a = Math.atan2(end[1] - prev[1], end[0] - prev[0]), s = 12;
    ctx.beginPath(); ctx.moveTo(...end);
    ctx.lineTo(end[0] - s * Math.cos(a - 0.45), end[1] - s * Math.sin(a - 0.45));
    ctx.lineTo(end[0] - s * Math.cos(a + 0.45), end[1] - s * Math.sin(a + 0.45));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// A moon-gold packet travelling along a path while k goes 0..1.
function pulse(pts, k) {
  if (k <= 0 || k >= 1) return;
  const lens = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); lens.push(l); total += l; }
  const at = (d) => { for (let i = 0; i < lens.length; i++) { if (d <= lens[i]) { const f = d / lens[i]; return [lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f)]; } d -= lens[i]; } return pts[pts.length - 1]; };
  const d = easeIO(k) * total;
  for (let j = 7; j >= 1; j--) { const p = at(Math.max(0, d - j * 10)); ctx.fillStyle = `rgba(179,139,63,${0.3 * (1 - j / 8)})`; circle(p[0], p[1], 7 - j * 0.6); ctx.fill(); }
  const p = at(d);
  ctx.fillStyle = "#fff"; circle(p[0], p[1], 10); ctx.fill();
  ctx.fillStyle = C.gold; circle(p[0], p[1], 7); ctx.fill();
}

// Numbered step badge that pops in.
function stepBadge(x, y, n, k) {
  if (k <= 0) return;
  const s = easeBack(clamp(k));
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = "rgba(22,32,61,0.18)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.fillStyle = C.navy; circle(0, 0, 17); ctx.fill();
  ctx.shadowColor = "transparent";
  text(String(n), 0, 7, { size: 18, weight: 700, color: C.goldSoft, align: "center" });
  ctx.restore();
}

// A white card with a soft shadow. hi (0..1) lifts it and lights the border in moon gold.
function card(x, y, w, h, { title = null, sub = null, sub2 = null, hi = 0, dashed = false, eyebrow = null, fill = C.card, titleSize = 22, subSize = 16, icon = null } = {}) {
  hi = clamp(hi);
  ctx.save();
  ctx.translate(0, -4 * hi);
  ctx.shadowColor = `rgba(22,32,61,${0.07 + 0.1 * hi})`; ctx.shadowBlur = 16 + 18 * hi; ctx.shadowOffsetY = 5 + 5 * hi;
  ctx.fillStyle = fill; rrect(x, y, w, h, 14); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = mix(C.line, C.gold, hi); ctx.lineWidth = 1.5 + 1.5 * hi;
  if (dashed) ctx.setLineDash([7, 6]);
  rrect(x, y, w, h, 14); ctx.stroke(); ctx.setLineDash([]);
  if (hi > 0.01) { ctx.fillStyle = `rgba(179,139,63,${hi})`; rrect(x, y + 14, 4, h - 28, 2); ctx.fill(); }
  let tx = x + 22;
  if (icon) { iconChip(x + 22, y + h / 2 - 20, 40, icon, hi); tx = x + 78; }
  let ty = y + (eyebrow ? 32 : 0);
  if (eyebrow) text(eyebrow.toUpperCase(), tx, ty, { size: 13, weight: 700, color: C.gold, spacing: 2 });
  if (title) { ty += eyebrow ? 32 : sub ? (h - (subSize + 11) - (sub2 ? subSize + 7 : 0)) / 2 + titleSize * 0.35 : h / 2 + titleSize * 0.35; text(title, tx, ty, { size: titleSize, weight: 600 }); }
  if (sub) { ty += subSize + 11; text(sub, tx, ty, { size: subSize, color: C.muted }); }
  if (sub2) { ty += subSize + 7; text(sub2, tx, ty, { size: subSize, color: C.muted }); }
  ctx.restore();
}

// Small line icons in a rounded navy chip.
function iconChip(x, y, s, kind, hi = 0) {
  ctx.save();
  ctx.fillStyle = mix(C.navy, C.navy2, hi); rrect(x, y, s, s, 10); ctx.fill();
  ctx.strokeStyle = C.goldSoft; ctx.fillStyle = C.goldSoft; ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const cx = x + s / 2, cy = y + s / 2, r = s * 0.28;
  ctx.beginPath();
  if (kind === "panel") { ctx.rect(cx - r, cy - r, r * 2, r * 2); ctx.moveTo(cx + r * 0.2, cy - r); ctx.lineTo(cx + r * 0.2, cy + r); ctx.stroke(); }
  else if (kind === "code") { ctx.moveTo(cx - r * 0.3, cy - r); ctx.lineTo(cx - r, cy); ctx.lineTo(cx - r * 0.3, cy + r); ctx.moveTo(cx + r * 0.3, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx + r * 0.3, cy + r); ctx.stroke(); }
  else if (kind === "layers") { for (let i = 0; i < 3; i++) { ctx.moveTo(cx - r, cy - r * 0.7 + i * r * 0.7); ctx.lineTo(cx + r, cy - r * 0.7 + i * r * 0.7); } ctx.stroke(); }
  else if (kind === "plug") { ctx.moveTo(cx - r * 0.4, cy - r); ctx.lineTo(cx - r * 0.4, cy - r * 0.3); ctx.moveTo(cx + r * 0.4, cy - r); ctx.lineTo(cx + r * 0.4, cy - r * 0.3); ctx.rect(cx - r * 0.75, cy - r * 0.3, r * 1.5, r * 0.8); ctx.moveTo(cx, cy + r * 0.5); ctx.lineTo(cx, cy + r); ctx.stroke(); }
  else if (kind === "copy") { ctx.rect(cx - r, cy - r * 0.6, r * 1.3, r * 1.6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx - r * 0.6, cy - r); ctx.lineTo(cx + r, cy - r); ctx.lineTo(cx + r, cy + r * 0.6); ctx.stroke(); }
  else if (kind === "folder") { ctx.moveTo(cx - r, cy - r * 0.6); ctx.lineTo(cx - r * 0.2, cy - r * 0.6); ctx.lineTo(cx, cy - r * 0.3); ctx.lineTo(cx + r, cy - r * 0.3); ctx.lineTo(cx + r, cy + r * 0.8); ctx.lineTo(cx - r, cy + r * 0.8); ctx.closePath(); ctx.stroke(); }
  else if (kind === "spark") { for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } ctx.stroke(); circle(cx, cy, 3); ctx.fill(); }
  else if (kind === "nodes") { const p = [[cx - r, cy + r * 0.6], [cx, cy - r * 0.8], [cx + r, cy + r * 0.6]]; ctx.moveTo(...p[0]); ctx.lineTo(...p[1]); ctx.lineTo(...p[2]); ctx.stroke(); p.forEach(([a, b]) => { circle(a, b, 3.5); ctx.fill(); }); }
  else if (kind === "check") { ctx.moveTo(cx - r, cy); ctx.lineTo(cx - r * 0.25, cy + r * 0.7); ctx.lineTo(cx + r, cy - r * 0.7); ctx.stroke(); }
  ctx.restore();
}

// ---------- background ----------
const R0 = rng(7);
const STARS = Array.from({ length: 70 }, () => { const a = R0() * 6.28, d = Math.sqrt(R0()); return { a, d, r: 0.6 + R0() * 1.4, p: R0() * 6.28 }; });
function background(t) {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.4, 100, W * 0.5, H * 0.5, W * 0.75);
  g.addColorStop(0, C.bgHi); g.addColorStop(1, C.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.dot;
  for (let y = 30; y < H; y += 36) for (let x = 30 + ((y / 36) % 2) * 18; x < W; x += 36) { ctx.fillRect(x, y, 2, 2); }
  // a large, faint moon arc in the top-right corner
  ctx.strokeStyle = "rgba(179,139,63,0.10)"; ctx.lineWidth = 2;
  circle(W + 60, -80, 420); ctx.stroke(); circle(W + 60, -80, 480); ctx.stroke();
}

const CRATERS = [[-0.32, -0.18, 0.16], [0.26, 0.26, 0.12], [0.08, -0.42, 0.08], [-0.12, 0.42, 0.09], [0.44, -0.1, 0.06]];
// phase 0 = new moon, 1 = full
function moon(x, y, r, phase = 1, shadowCol = C.navy) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, C.moonLight); g.addColorStop(0.75, C.moonMid); g.addColorStop(1, C.moonDark);
  ctx.fillStyle = g; circle(x, y, r); ctx.fill();
  for (const [cx, cy, cr] of CRATERS) { ctx.fillStyle = "rgba(150,138,110,0.18)"; circle(x + cx * r, y + cy * r, cr * r); ctx.fill(); }
  if (phase < 1) {
    ctx.save(); circle(x, y, r + 0.5); ctx.clip();
    ctx.fillStyle = shadowCol; ctx.globalAlpha = 0.94; circle(x - r * 2.1 * easeIO(phase), y, r * 1.04); ctx.fill();
    ctx.restore();
  }
}

// The night-sky window: a navy disc with stars and the moon inside, on the light page.
function nightWindow(x, y, R, t, phase, k = 1) {
  ctx.save();
  ctx.shadowColor = "rgba(22,32,61,0.25)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.3, R * 0.1, x, y, R);
  g.addColorStop(0, C.navy2); g.addColorStop(1, C.navy);
  ctx.fillStyle = g; circle(x, y, R * k); ctx.fill();
  ctx.restore();
  ctx.save(); circle(x, y, R * k); ctx.clip();
  for (const s of STARS) { ctx.fillStyle = `rgba(245,240,226,${0.35 + 0.35 * Math.sin(t * 1.3 + s.p)})`; circle(x + Math.cos(s.a) * s.d * R, y + Math.sin(s.a) * s.d * R, s.r); ctx.fill(); }
  const hg = ctx.createRadialGradient(x, y, R * 0.45, x, y, R * 0.95);
  hg.addColorStop(0, "rgba(245,240,226,0.16)"); hg.addColorStop(1, "rgba(245,240,226,0)");
  ctx.fillStyle = hg; circle(x, y, R); ctx.fill();
  moon(x, y, R * 0.5, phase, C.navy);
  ctx.restore();
  ctx.strokeStyle = C.goldSoft; ctx.lineWidth = 3; circle(x, y, R * k); ctx.stroke();
}

// Chapter tracker, top right.
const CHAPTERS = ["Architecture", "MCP tools", "Agent flow", "Context"];
const CHAPTER_SCENES = ["arch", "talk", "flow", "context"];
function chapters(current, a) {
  // Only the chapters whose scenes are in this render (the short intro skips some).
  const shown = CHAPTERS.filter((_, i) => !TL.length || TL.some((sc) => sc.id === CHAPTER_SCENES[i]));
  const name = CHAPTERS[current];
  withAlpha(a, () => {
    let x = 1810;
    for (let i = shown.length - 1; i >= 0; i--) {
      const on = shown[i] === name;
      ctx.font = `${on ? 700 : 500} 17px ${SANS}`; const w = ctx.measureText(shown[i]).width;
      text(shown[i], x, 96, { size: 17, weight: on ? 700 : 500, color: on ? C.text : C.faint, align: "right" });
      if (on) { ctx.fillStyle = C.gold; rrect(x - w, 106, w, 3, 2); ctx.fill(); }
      x -= w + 34;
      if (i > 0) { ctx.fillStyle = C.line; circle(x + 17, 90, 3); ctx.fill(); }
    }
  });
}

function heading(u, eyebrow, title) {
  const a = ap(u, 0.05, 0.6);
  withAlpha(a, () => {
    const dx = (1 - a) * -24;
    ctx.fillStyle = C.gold; rrect(110 + dx, 78, 34, 4, 2); ctx.fill();
    text(eyebrow.toUpperCase(), 156 + dx, 86, { size: 15, weight: 700, color: C.gold, spacing: 3 });
    text(title, 110 + dx, 146, { size: 48, weight: 700, color: C.text, spacing: -0.5 });
  });
}

// ---------- scenes ----------
function sceneWhatIs(u, D, T) {
  const ph = easeIO(clamp((u - 0.3) / 2.2));
  const k = easeBack(clamp(u / 0.9));
  nightWindow(560, 500, 280, u, 0.15 + 0.85 * ph, k);
  // an orbit with a small satellite
  withAlpha(ap(u, 1.2, 0.8), () => {
    ctx.save(); ctx.translate(560, 500); ctx.rotate(-0.35);
    ctx.strokeStyle = "rgba(179,139,63,0.45)"; ctx.lineWidth = 2; ctx.setLineDash([3, 9]);
    ctx.beginPath(); ctx.ellipse(0, 0, 360, 110, 0, 0, 6.29); ctx.stroke(); ctx.setLineDash([]);
    const a = u * 0.9;
    const sx = Math.cos(a) * 360, sy = Math.sin(a) * 110;
    if (Math.sin(a) > 0 || Math.hypot(sx, sy) > 285) { ctx.fillStyle = C.gold; circle(sx, sy, 9); ctx.fill(); ctx.fillStyle = "#fff"; circle(sx, sy, 3.5); ctx.fill(); }
    ctx.restore();
  });
  // title, letter by letter
  const word = "Moon";
  ctx.font = `800 132px ${SANS}`; let x = 980;
  [...word].forEach((ch, i) => {
    const a = ap(u, 0.6 + i * 0.09, 0.5);
    withAlpha(a, () => text(ch, x, 400 + (1 - a) * 40, { size: 132, weight: 800, color: C.navy, spacing: -3 }));
    ctx.font = `800 132px ${SANS}`; ctx.letterSpacing = "-3px"; x += ctx.measureText(ch).width; ctx.letterSpacing = "0px";
  });
  withAlpha(ap(u, 1.1, 0.6), () => {
    ctx.fillStyle = C.gold; rrect(986, 430, 90 * ap(u, 1.1, 0.8), 5, 3); ctx.fill();
    const lead = "A coding agent for VS Code, built on ";
    text(lead, 984, 486, { size: 32, weight: 500, color: C.muted });
    ctx.font = `500 32px ${SANS}`; const lw = ctx.measureText(lead).width;
    text("TrueForge", 984 + lw, 486, { size: 32, weight: 700, color: C.gold });
  });
  // header: team on the left, event on the right
  withAlpha(ap(u, 0.4, 0.6), () => {
    moon(122, 84, 13, 1);
    text("Team Simpletons", 146, 92, { size: 20, weight: 700, color: C.navy });
    ctx.font = `700 20px ${SANS}`; const tw = ctx.measureText("Team Simpletons").width;
    ctx.fillStyle = C.line; circle(146 + tw + 16, 85, 3); ctx.fill();
    text("MNNIT Allahabad", 146 + tw + 32, 92, { size: 18, color: C.muted });
    text("TrueFoundry Forge-a-thon  ·  Techfest 2026-27, IIT Bombay", 1810, 92, { size: 18, weight: 500, color: C.muted, align: "right" });
    ctx.fillStyle = C.line; ctx.fillRect(110, 118, 1700, 1.5);
  });
  // a row of moon phases under the night window, filling one by one
  for (let i = 0; i < 7; i++) {
    const a = ap(u, 0.9 + i * 0.12, 0.4);
    withAlpha(a, () => {
      const x = 560 + (i - 3) * 62, y = 868;
      ctx.save(); ctx.shadowColor = "rgba(22,32,61,0.15)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
      ctx.fillStyle = C.navy; circle(x, y, 17); ctx.fill(); ctx.restore();
      moon(x, y, 14, [0.12, 0.24, 0.36, 0.5, 0.64, 0.8, 1][i], C.navy);
    });
  }
  const rows = [["edits code inline", "Inline edits, reviewed hunk by hunk", "code"], ["works across", "Agent mode across the whole project", "nodes"], ["changes nothing", "Nothing lands until you approve it", "check"]];
  rows.forEach(([cue, label, icon], i) => {
    const a = ap(u, T(cue) - 0.15, 0.45);
    withAlpha(a, () => card(984 + (1 - a) * 40, 530 + i * 86, 640, 70, { title: label, icon, titleSize: 24, hi: bump(u, T(cue) - 0.1, T(cue) + 1.6) }));
  });
  // roadmap
  const r = ap(u, T("First, how") - 0.15, 0.5);
  withAlpha(r, () => {
    const y = 852;
    card(984, y, 330, 64, { title: "1   How Moon works", titleSize: 21, hi: 1, fill: C.cream });
    connector([[1326, y + 32], [1394, y + 32]], { k: ap(u, T("Then the live"), 0.5), color: C.faint, flow: ap(u, T("Then the live"), 0.5), t: u });
    withAlpha(ap(u, T("Then the live"), 0.5), () => card(1404, y, 220, 64, { title: "2   Live demo", titleSize: 21 }));
  });
}

// Fig. 1 of the write-up, redrawn; the camera follows the part being explained.
function sceneArch(u, D, T) {
  heading(u, "How Moon works", "Architecture on TrueForge");
  chapters(0, ap(u, 0.3));
  const tUI = T("The Moon panel"), tHost = T("thin Visual"), tCore = T("the logic lives");
  const tSend = T("Core sends"), tBack = T("streams events"), tOnly = T("Only TrueForge"), tClaude = T("Claude first"), tDS = T("DeepSeek");
  const tMcp = T("The agent edits"), tHidden = T("hidden copy"), tAccept = T("only accepted");

  // camera keyframes: [time, centreX, centreY, zoom]
  const keys = [[0, 960, 590, 0.96], [tUI, 520, 470, 1.32], [tCore, 520, 580, 1.3], [tSend, 860, 520, 1.12], [tOnly, 1360, 520, 1.25], [tMcp, 640, 720, 1.25], [tAccept + 1.2, 960, 590, 0.96]];
  let cam = keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    const k = easeIO(clamp((u - keys[i][0] + 0.2) / 1.0));
    cam = cam.map((v, j) => lerp(v, keys[i][j + 1], k));
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 196, W, 760); ctx.clip();
  ctx.translate(W / 2, 590); ctx.scale(cam[2], cam[2]); ctx.translate(-cam[0], -cam[1]);

  // VS Code side
  withAlpha(ap(u, tUI - 0.4), () => {
    ctx.fillStyle = "rgba(223,230,243,0.55)"; rrect(110, 225, 800, 575, 20); ctx.fill();
    ctx.strokeStyle = "#c9d4e8"; ctx.lineWidth = 1.5; rrect(110, 225, 800, 575, 20); ctx.stroke();
    text("VS CODE  ·  MOON EXTENSION", 136, 262, { size: 14, weight: 700, color: C.blue, spacing: 2 });
  });
  const pop = (s) => ap(u, s, 0.45);

// A small rounded label (event names, tool names, tags).
function pill(x, y, label, { bg = C.card, fg = C.text, border = C.line, size = 15, font = MONO, align = "left" } = {}) {
  ctx.font = `500 ${size}px ${font}`;
  const w = ctx.measureText(label).width + 26, h = size + 16;
  const x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  ctx.save(); ctx.shadowColor = "rgba(22,32,61,0.08)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
  ctx.fillStyle = bg; rrect(x0, y - h / 2, w, h, h / 2); ctx.fill(); ctx.restore();
  ctx.strokeStyle = border; ctx.lineWidth = 1.2; rrect(x0, y - h / 2, w, h, h / 2); ctx.stroke();
  text(label, x0 + 13, y + size * 0.36, { size, font, weight: 500, color: fg });
  return w;
}

function lock(x, y, s = 12, color = C.gold) {
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y - s * 0.35, s * 0.42, Math.PI, 0); ctx.stroke();
  rrect(x - s * 0.6, y - s * 0.35, s * 1.2, s * 0.95, 3); ctx.fill(); ctx.restore();
}

// ---------- timeline and captions ----------
let TL = [];
const FADE = 0.45;
window.setTimeline = (tl) => { TL = tl; };

function phraseTimer(sc) {
  return (phrase) => {
    const i = sc.text.indexOf(phrase);
    if (i < 0) return sc.voiceAt - sc.start;
    return sc.voiceAt - sc.start + sc.voiceLen * (i / sc.text.length);
  };
}

function chunks(s) {
  const parts = s.match(/[^.:]+[.:]?/g).map((p) => p.trim()).filter(Boolean);
  const out = [];
  for (const p of parts) {
    if (p.length <= 82) { out.push(p); continue; }
    let cur = "";
    for (const w of p.split(" ")) { if ((cur + " " + w).trim().length > 70 && cur) { out.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
    if (cur) out.push(cur);
  }
  return out;
}
function caption(sc, t) {
  const v = t - sc.voiceAt;
  if (v < 0 || v > sc.voiceLen + 0.3) return;
  const cs = chunks(sc.text), total = cs.reduce((n, c) => n + c.length, 0);
  let acc = 0, idx = 0;
  for (let i = 0; i < cs.length; i++) { if (v / sc.voiceLen >= acc / total) idx = i; acc += cs[i].length; }
  const s = cs[idx];
  const a = clamp(v / 0.2) * (1 - clamp((v - sc.voiceLen) / 0.3));
  withAlpha(a, () => {
    ctx.font = `500 27px ${SANS}`;
    const w = ctx.measureText(s).width + 64;
    ctx.save(); ctx.shadowColor = "rgba(22,32,61,0.12)"; ctx.shadowBlur = 16; ctx.shadowOffsetY = 4;
    ctx.fillStyle = C.navy; rrect(W / 2 - w / 2, 974, w, 52, 26); ctx.fill(); ctx.restore();
    text(s, W / 2, 1009, { size: 27, color: "#f5f1e6", align: "center" });
  });
}

window.renderAt = (t) => {
  background(t);
  for (const sc of TL) {
    const u = t - sc.start;
    if (u < -0.01 || u > sc.dur + FADE) continue;
    const a = clamp(u / FADE) * (1 - clamp((u - sc.dur) / FADE));
    withAlpha(a, () => SCENES[sc.id](u, sc.dur, phraseTimer(sc)));
  }
  for (const sc of TL) caption(sc, t);
  const end = TL.length ? TL[TL.length - 1].start + TL[TL.length - 1].dur : 1e9;
  const f = clamp((t - end) / FADE);
  if (f > 0) { ctx.fillStyle = `rgba(244,242,236,${f})`; ctx.fillRect(0, 0, W, H); }
};

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all(["400 30px Inter", "500 30px Inter", "600 30px Inter", "700 30px Inter", "800 30px Inter", '500 20px "JetBrains Mono"'].map((f) => document.fonts.load(f, "Moon")));
  return true;
})();

  let s = 0; TL = demo.map((d) => { const sc = { ...d, start: s, voiceAt: s + 0.8, voiceLen: d.dur - 1.5 }; s += d.dur; return sc; });
  const t0 = performance.now();

  window.ready.then(loop);
}
